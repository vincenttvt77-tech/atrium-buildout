<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>The Larkin — Front desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<!-- Front desk shell. Sources live in ops/src/ and are composed by `npm run build:ops`:
     each @include line becomes the file wrapped in <style> / <script>. The include order is
     the contract's: styles, calendar, leads, calls (CSS), then app, calls, calendar, leads (JS).
     app.js boots on DOMContentLoaded after every module has registered — no inline boot call. -->
<style>
/* Front desk — shell styles. Owner: shell. Tokens, reset, layout, and every shared
   component class the modules use (brief §3, §4). Dark values live once under
   prefers-color-scheme; every colour on the page comes from these tokens. */

:root {
  color-scheme: light dark;
  --paper: #F6F3EC;
  --paper-2: #FFFFFF;
  --paper-3: #EEEAE0;
  --ink: #1C1B19;
  --ink-2: #5E5A52;
  --ink-3: #726C63;
  --line: #E3DED2;
  --line-strong: #CFC8B8;
  --accent: #7F5E33;
  --accent-strong: #6A4D27;
  --accent-soft: #F1E7D8;
  --on-accent: #FFFFFF;
  --ok: #2F6B4F;
  --ok-soft: #DDEBE1;
  --ok-line: #9FC5AF;
  --warn: #8F5300;
  --warn-soft: #FBEBC8;
  --danger: #B23A2E;
  --danger-soft: #F9E1DD;
  --blocked: #6B6560;
  --blocked-soft: #EAE6DD;
  --blocked-stripe: #DAD4C6;
  --lost: #6F5F73;
  --lost-soft: #ECE6EE;
  --info: #3E6480;
  --info-soft: #DFE9F0;
  --focus: #7F5E33;
  --scrim: rgba(28, 27, 25, .32);
  --shadow-pop: 0 8px 24px rgba(28, 27, 25, .14), 0 1px 2px rgba(28, 27, 25, .08);
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  --r-ctrl: 6px; --r-card: 10px; --r-sheet: 14px;
  --ctrl-h: 36px;
  --side-w: 232px;
  --main-pad: 32px;
  --font: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --motion: 140ms;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #15140F;
    --paper-2: #1E1D18;
    --paper-3: #1A1914;
    --ink: #EDE8DC;
    --ink-2: #B5AE9F;
    --ink-3: #948E82;
    --line: #2E2C25;
    --line-strong: #3D3A31;
    --accent: #C79A5E;
    --accent-strong: #D9AE72;
    --accent-soft: #3A2E1E;
    --on-accent: #15140F;
    --ok: #8CC7A5;
    --ok-soft: #1F3A2C;
    --ok-line: #3F6B52;
    --warn: #E0A15A;
    --warn-soft: #3C2A12;
    --danger: #E8867A;
    --danger-soft: #3D1D19;
    --blocked: #A39B8E;
    --blocked-soft: #2A2823;
    --blocked-stripe: #35322B;
    --lost: #B8A6BE;
    --lost-soft: #2C2530;
    --info: #8DB4CF;
    --info-soft: #1E2E3A;
    --focus: #C79A5E;
    --scrim: rgba(0, 0, 0, .6);
    --shadow-pop: 0 8px 24px rgba(0, 0, 0, .55), 0 1px 2px rgba(0, 0, 0, .4);
  }
}
@media (max-width: 959px) {
  :root { --ctrl-h: 44px; --main-pad: 16px; }
  html { font-size: 15px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: .01ms !important;
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }
}

/* ---------- reset and base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { font-size: 14px; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font);
  font-size: 1rem;
  line-height: 1.43;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
  overflow-wrap: anywhere;
}
::selection { background: var(--accent-soft); }
h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; }
h1 { font-size: 1.714rem; line-height: 1.25; font-weight: 600; }
h2 { font-size: 1.286rem; line-height: 1.33; font-weight: 600; }
h3 { font-size: 1.071rem; line-height: 1.33; font-weight: 600; }
h1:focus, h2:focus { outline: none; }
a { color: var(--accent); }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
svg { flex: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
details > summary { cursor: pointer; }
details > summary::-webkit-details-marker { display: none; }
[hidden] { display: none !important; }

/* type steps */
.display { font-size: 2.286rem; line-height: 1.125; font-weight: 600; }
.label { font-size: .929rem; line-height: 1.385; font-weight: 600; }
.small { font-size: .929rem; line-height: 1.385; }
.caption { font-size: .857rem; line-height: 1.333; font-weight: 500; }
.strong { font-weight: 500; }
.prose { max-width: 68ch; }

/* utilities */
.vh { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.num, .badge, .chip, .big-number-value, .cal-gutter { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.stack { display: flex; flex-direction: column; gap: var(--s2); }
.cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); }
.link { color: var(--accent); text-decoration: none; }
.link:hover { text-decoration: underline; }
.ico { display: inline-flex; width: 1em; height: 1em; vertical-align: -.15em; }
.ico svg { width: 100%; height: 100%; }
.ok-text { color: var(--ok); }
.warn-text { color: var(--warn); }
.danger-text { color: var(--danger); }

/* ---------- layout: sidebar / top bar / tab bar ---------- */
.skip {
  position: absolute; left: -999px; top: 8px; z-index: 100;
  padding: 8px 12px; background: var(--paper-2); color: var(--accent);
  border: 1px solid var(--line-strong); border-radius: var(--r-ctrl); text-decoration: none;
}
.skip:focus { left: 8px; }

.side {
  position: fixed; top: 0; left: 0; bottom: 0; width: var(--side-w); z-index: 20;
  display: flex; flex-direction: column;
  padding: 20px 12px 16px;
  background: var(--paper-3); border-right: 1px solid var(--line);
}
.brand { padding: 4px 12px 16px; }
.brand-name { display: block; font-size: 1rem; font-weight: 600; }
.brand-sub { display: block; font-size: .857rem; color: var(--ink-3); }
.brand-date { display: block; font-size: .857rem; color: var(--ink-3); margin-top: 2px; }
.brand-view { display: none; }

.nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  position: relative; display: flex; align-items: center; gap: 10px;
  height: 40px; padding: 0 12px; border-radius: var(--r-ctrl);
  color: var(--ink); text-decoration: none; font-weight: 500;
}
.nav-item:hover { background: var(--line); text-decoration: none; }
.nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav-item[aria-current="page"]::before {
  content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px;
  border-radius: 2px; background: var(--accent);
}
.nav-icon { display: inline-flex; position: relative; }
.nav-icon svg { width: 20px; height: 20px; }
.nav-label { flex: 1; }
.badge {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 18px; padding: 0 6px; border-radius: 999px;
  font-size: .786rem; font-weight: 600; line-height: 1;
  background: var(--paper-2); color: var(--ink-2); border: 1px solid var(--line);
}
.badge-warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.badge-danger { background: var(--danger); color: var(--on-accent); border-color: transparent; }
.nav-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }

.side-foot { margin-top: auto; padding: 12px 12px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.cluster-link { display: block; color: inherit; text-decoration: none; }
.cluster-link:hover { text-decoration: none; }
.cluster-link:hover .cluster-l1 { text-decoration: underline; }
.cluster-desk { display: flex; gap: 8px; align-items: flex-start; }
.cluster-desk .ico { width: 16px; height: 16px; margin-top: 2px; }
.cluster-l1 { display: block; font-size: .929rem; font-weight: 500; }
.cluster-l2 { display: block; font-size: .857rem; color: var(--ink-3); margin-top: 2px; }
.cluster-mobile { display: none; align-items: center; gap: 6px; font-size: .857rem; font-weight: 500; }
.cluster-mobile .ico { width: 16px; height: 16px; }
.cluster-warn .cluster-l1, .cluster-warn .ico, .cluster-warn.cluster-mobile { color: var(--warn); }
.cluster-ok .ico { color: var(--ok); }
.staff-only { display: inline-flex; align-items: center; gap: 6px; font-size: .857rem; color: var(--ink-3); text-decoration: none; }
.staff-only .ico { width: 14px; height: 14px; }

main { margin-left: var(--side-w); padding: var(--main-pad); min-height: 100vh; }
main:focus { outline: none; }
.view { max-width: 1120px; }
.view-head { margin-bottom: var(--s5); }
.view-head h1 { display: inline-block; }
.dateline { margin-top: 2px; }
.briefing { margin-top: 8px; max-width: 68ch; }
.global-banners:not(:empty) { margin-bottom: var(--s4); max-width: 1120px; }

@media (max-width: 959px) {
  .side {
    position: sticky; top: 0; bottom: auto; width: auto; height: 52px;
    flex-direction: row; align-items: center; justify-content: space-between;
    padding: 0 16px; border-right: 0; border-bottom: 1px solid var(--line);
  }
  .brand { padding: 0; display: flex; align-items: baseline; gap: 4px; min-width: 0; }
  .brand-name { white-space: nowrap; }
  .brand-sub, .brand-date { display: none; }
  .brand-view { display: inline; color: var(--ink-2); font-weight: 400; white-space: nowrap; }
  .nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    height: calc(56px + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--paper-3); border-top: 1px solid var(--line);
  }
  .nav ul { flex-direction: row; height: 56px; gap: 0; }
  .nav li { flex: 1 1 0; min-width: 0; }
  .nav-item {
    width: 100%; min-width: 0; flex-direction: column; justify-content: center; gap: 2px;
    height: 56px; padding: 0; border-radius: 0; border-top: 2px solid transparent;
    font-size: .733rem; font-weight: 500;
  }
  .nav-item:hover { background: transparent; }
  .nav-item[aria-current="page"] { background: transparent; border-top-color: var(--accent); }
  .nav-item[aria-current="page"]::before { display: none; }
  .nav-icon svg { width: 22px; height: 22px; }
  .nav-item .badge { position: absolute; top: 4px; left: calc(50% + 6px); }
  .nav-item .nav-dot { position: absolute; top: 8px; left: calc(50% + 8px); }
  .side-foot { margin: 0; padding: 0; border: 0; flex-direction: row; align-items: center; }
  .staff-only { display: none; }
  .cluster-desk { display: none; }
  .cluster-mobile { display: inline-flex; }
  main { margin-left: 0; padding: var(--main-pad); padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px)); min-height: 0; }
}

/* ---------- buttons ---------- */
.btn, .btn-icon {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: var(--ctrl-h); padding: 0 12px; border-radius: var(--r-ctrl);
  background: var(--paper-2); color: var(--ink); border: 1px solid var(--line-strong);
  font-weight: 500; font-size: 1rem; line-height: 1; text-decoration: none; white-space: nowrap;
  transition: background var(--motion) ease-out, opacity var(--motion) ease-out;
}
.btn:hover, .btn-icon:hover { background: var(--paper-3); text-decoration: none; }
.btn .ico, .btn-icon .ico { width: 18px; height: 18px; }
.btn-primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn-primary:hover { background: var(--accent-strong); }
.btn-quiet { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn-quiet:hover { background: var(--paper-3); color: var(--ink); }
.btn-danger { background: var(--danger); color: #fff; border-color: transparent; }
.btn-danger:hover { background: var(--danger); filter: brightness(.92); }
.btn-link {
  display: inline; height: auto; padding: 0; border: 0; background: none;
  color: var(--accent); font-weight: 500; text-decoration: none; white-space: normal; text-align: left;
}
.btn-link:hover { background: none; text-decoration: underline; }
.btn-icon { width: var(--ctrl-h); padding: 0; }
.btn-icon.btn-quiet { border-color: transparent; }
.btn[aria-disabled="true"], .btn-icon[aria-disabled="true"], .btn:disabled, .btn-icon:disabled, .btn-link[aria-disabled="true"], .chip-filter[aria-disabled="true"] {
  opacity: .5; cursor: not-allowed;
}
.is-busy { position: relative; color: transparent !important; pointer-events: none; }
.is-busy > * { visibility: hidden; }
.is-busy::after {
  content: ""; position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px;
  border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--ink-2);
  animation: spin .8s linear infinite;
}
.btn-primary.is-busy::after { border-color: rgba(255, 255, 255, .35); border-top-color: var(--on-accent); }
@keyframes spin { to { transform: rotate(360deg); } }
.spin svg { animation: spin 1s linear infinite; }

/* ---------- chips ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px;
  border-radius: 999px; font-size: .929rem; font-weight: 500; line-height: 1; white-space: nowrap;
  background: var(--paper-3); color: var(--ink-2);
}
.chip .ico { width: 14px; height: 14px; }
.chip-ok { background: var(--ok-soft); color: var(--ok); }
.chip-warn { background: var(--warn-soft); color: var(--warn); }
.chip-danger { background: var(--danger-soft); color: var(--danger); }
.chip-blocked { background: var(--blocked-soft); color: var(--blocked); }
.chip-lost { background: var(--lost-soft); color: var(--lost); }
.chip-info { background: var(--info-soft); color: var(--info); }
.chip-neutral { background: var(--paper-3); color: var(--ink-2); }
.chip-filter {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px;
  border-radius: var(--r-ctrl); background: var(--paper-2); border: 1px solid var(--line);
  color: var(--ink); font-size: .929rem; font-weight: 500; white-space: nowrap;
  transition: background var(--motion) ease-out;
}
.chip-filter .ico { width: 14px; height: 14px; display: none; }
.chip-filter[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.chip-filter[aria-pressed="true"] .ico { display: inline-flex; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
@media (max-width: 959px) { .chip-filter { height: 44px; } }

/* ---------- cards, rows, sections ---------- */
.card { background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--r-card); padding: var(--s4); }
.card-warn { border-left: 3px solid var(--warn); background: var(--warn-soft); }
.card-danger { border-left: 3px solid var(--danger); background: var(--danger-soft); }
.card-demo { border: 2px solid var(--warn); }
.card.rows { padding: 0; overflow: hidden; }
.card.rows > .row:last-child { border-bottom: 0; }
.card-warn.rows > .row, .card-danger.rows > .row { background: transparent; }

.row {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; column-gap: 12px; row-gap: 6px; align-items: start;
  padding: 12px 16px; background: var(--paper-2); border-bottom: 1px solid var(--line);
  min-height: 48px; width: 100%; text-align: left; color: inherit; text-decoration: none;
  transition: opacity var(--motion) ease-out, background var(--motion) ease-out;
}
.row:first-child { border-top-left-radius: inherit; border-top-right-radius: inherit; }
.row:last-child { border-bottom-left-radius: inherit; border-bottom-right-radius: inherit; }
button.row { border-left: 0; border-right: 0; border-top: 0; font: inherit; }
.row-lead { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; color: var(--ink-2); font-size: .929rem; padding-top: 2px; }
.row-lead .ico { width: 18px; height: 18px; }
.row-lead-icon { color: var(--ink-2); display: inline-flex; }
.row-body { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row-title { font-weight: 500; }
.row-sub { font-size: .929rem; color: var(--ink-2); }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; }
.row-click { cursor: pointer; }
.row-click:hover { background: var(--paper-3); text-decoration: none; }
.row-selected, .row[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.row-busy { opacity: .6; }
.row-muted, .row-muted .row-title, .row-muted .row-sub { color: var(--ink-3); }
.row-leaving { opacity: 0; }
.row-new { animation: fade-in 120ms ease-out; }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@media (max-width: 959px) { .row { min-height: 56px; } }
@media (max-width: 479px) {
  .row-actions { grid-column: 1 / -1; justify-content: flex-start; }
  .row-actions .btn-primary { width: 100%; }
}

.section { margin-top: var(--s6); }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: var(--s2); }
.section-head h2 .count { color: var(--ink-3); font-weight: 500; }
.section-head .btn-link { flex: none; }

.big-number { display: block; color: inherit; text-decoration: none; }
.big-number:hover { text-decoration: none; border-color: var(--line-strong); }
.big-number-label { display: block; font-size: .929rem; color: var(--ink-2); }
.big-number-value { display: block; font-size: 2.286rem; line-height: 1.125; font-weight: 600; margin-top: 4px; }
.big-number-note { display: block; font-size: .929rem; color: var(--ink-3); margin-top: 4px; }
.big-number-warn .big-number-value { color: var(--warn); }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: var(--s2); }
@media (max-width: 479px) { .tiles { gap: 8px; } .tiles .big-number { padding: 12px; min-width: 0; } .big-number-value { font-size: 1.9rem; } }

/* ---------- banners, empty, skeleton ---------- */
.banner {
  display: flex; align-items: flex-start; gap: 10px; padding: 12px 16px; border-radius: var(--r-card);
  font-size: 1rem; max-width: 100%;
}
.banner .ico { width: 18px; height: 18px; margin-top: 2px; }
.banner-body { flex: 1; min-width: 0; }
.banner-warn { background: var(--warn-soft); color: var(--warn); }
.banner-danger { background: var(--danger-soft); color: var(--danger); }
.banner-info { background: var(--info-soft); color: var(--info); }
.banner a, .banner .btn-link { color: inherit; text-decoration: underline; }
.banner .btn { color: var(--ink); }
.banner + .banner, .banner + .section, .banner + .label { margin-top: var(--s3); }
.banner-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

.empty { text-align: center; padding: var(--s5); color: var(--ink-2); }
.empty .ico { width: 32px; height: 32px; color: var(--ink-3); margin-bottom: 8px; }
.empty-title { font-weight: 500; color: var(--ink); }
.empty-text { font-size: .929rem; color: var(--ink-2); margin-top: 4px; max-width: 48ch; margin-left: auto; margin-right: auto; }
.empty .btn { margin-top: 12px; }

.skeleton { display: flex; flex-direction: column; gap: 8px; }
.skeleton-line, .skeleton-row {
  border-radius: var(--r-ctrl);
  background: var(--paper-3);
  background-image: repeating-linear-gradient(90deg, var(--paper-3) 0, var(--line) 40%, var(--paper-3) 80%);
  background-size: 200% 100%;
  animation: shimmer 1.4s linear infinite;
}
.skeleton-line { height: 12px; width: 60%; }
.skeleton-row { height: 48px; border-radius: var(--r-card); }
.skeleton-tile { height: 110px; border-radius: var(--r-card); }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skeleton-line, .skeleton-row { animation: none; background-image: none; } }

/* ---------- fields ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field-label { font-size: .929rem; font-weight: 600; }
.field-hint { font-size: .929rem; color: var(--ink-3); }
.field-error { display: flex; align-items: center; gap: 6px; font-size: .929rem; color: var(--danger); }
.input, .select, .search input {
  height: var(--ctrl-h); padding: 0 10px; border-radius: var(--r-ctrl); width: 100%;
  background: var(--paper-2); border: 1px solid var(--line-strong); color: var(--ink);
}
.input::placeholder, .search input::placeholder { color: var(--ink-3); }

<script>
/*
 * Front desk shell — window.Atrium. Owner: shell. Plain ES2020 script; no modules, no deps.
 *
 * BOOT: this file registers only `window.Atrium` while it loads. The other scripts
 * (calls.js, calendar.js, leads.js) run after it and call `Atrium.register(name, module)` at
 * load. On DOMContentLoaded the shell registers its own views (today, status), paints the
 * chrome, resolves the hash route, starts polling, and fetches /api/health once. There is no
 * inline boot call in index.html. `Atrium.boot()` is idempotent.
 *
 * THE CONTRACT (CONSTRAINTS.md "The shell contract" + brief §5) — every member, in order:
 *
 *   Atrium.escapeHtml(s)      String(s ?? '') with & < > " ' escaped — the only path to innerHTML.
 *   Atrium.fmt.day(v)         'Tue, Sep 8' (+ ', 2027' when not the current NY year); 'YYYY-MM-DD'
 *                             and UTC-midnight instants render as the calendar day they encode.
 *   Atrium.fmt.dayLong(v)     'Tuesday, September 8'
 *   Atrium.fmt.time(iso)      '2:00 PM' (New York)
 *   Atrium.fmt.dateTime(iso)  'Today 2:14 PM' | 'Yesterday 6:40 PM' | 'Tomorrow 10:00 AM' | 'Tue, Sep 8, 2:14 PM'
 *   Atrium.fmt.relative(iso)  'just now' | '3 min ago' | '2 hours ago' | 'yesterday' | '3 days ago' | 'Tue, Sep 1'
 *                             future: 'in 5 min' | 'in 2 hours' | 'tomorrow' | 'in 3 days' | 'Tue, Sep 15'
 *   Atrium.fmt.duration(s)    '7 min' (≥ 60 s, rounded) | '45 sec' | '—' when null. The brief's
 *                             staff wording replaces the contract's '4m 12s' example on purpose.
 *   Atrium.fmt.money(n)       a dollar sign then 4,200 (USD + n; see the build note below)
 *   Atrium.fmt.phone(s)       '(516) 990-9252' when US-shaped, else the input; 'unknown'/null → ''
 *   Atrium.fmt.nyDate(v)      'YYYY-MM-DD' in New York

let crCache = { key: null, value: [] }

  for (const p of profilesOf(s)) for (const c of arr(p && p.calls)) if (c && c.callId) byCallId.set(c.callId, { profile: p, summary: c })

    const known = byCallId.get(id)

  for (const [id, { profile, summary }] of byCallId) {

  for (const e of arr(s.events)) {

    if (!grouped.has(id)) grouped.set(id, [])
    grouped.get(id).push(e)
  }
  for (const [id, evs] of grouped) {

    const profile = profileForCall(s, id)

  }

  crCache = { key, value }
  return value
}

const sizeWord = (v) => {

}

}

  if (o === 'priced_out') return `Nothing under ${fmt.money(ev.budgetMax)} — our lowest is ${fmt.money(ev.cheapestAvailable)}, so they're ${fmt.money(ev.gap)} short`

  if ((m = /^Booked a tour of (.+)$/.exec(o))) return `The assistant booked a tour of apartment ${m[1].trim()}.`

const PRICED_OUT_RE = /^Nothing(?: \S+)? is available at or below \$/

function callStory(record, s) {

  const f = {
    emergency: null, restricted: null, booked: null, arranging: null, bookFailed: false, slotTaken: false, bookInvalid: false,

    answered: [], captured: {}, unreadable: [], slots: null, noSlots: false, dropped: false, crash: false,

  for (const e of ev('availability_checked')) {
    if (e.outcome === 'priced_out') f.pricedOut = { budget: e.budgetMax, cheapest: e.cheapestAvailable, gap: e.gap }

      else if (/^Nothing matches on any of size/.test(res)) steps.push({ icon: 'home', text: "Checked what's available — nothing matched on size, date or budget; asked what they'd be flexible on." })
      else if (/^I need to re-check/.test(res)) steps.push({ icon: 'home', text: "Checked what's available — the list was out of date, so it didn't quote." })
      else if ((m = /^Residence (\S+) is available:[^$]*\$([\d,]+)\/month/.exec(res))) steps.push({ icon: 'home', text: `Looked up apartment ${m[1]}: available at ` + USD + m[2] + '.' })
      else if ((m = /^There is no residence (\S+?) /i.exec(res))) steps.push({ icon: 'home', text: `Looked up apartment ${m[1]}: not on the list.` })
      else if ((m = /^Residence (\S+) is pending/.exec(res))) steps.push({ icon: 'home', text: `Looked up apartment ${m[1]}: pending an application.` })
      else if ((m = /^Residence (\S+) is not currently available/.exec(res))) steps.push({ icon: 'home', text: `Looked up apartment ${m[1]}: not available.` })
      else if ((m = /^(.+?) \((\w+)\): [\s\S]*?Open now/.exec(res))) { const ids = unitIdsIn(res, /^Unit ([A-Za-z0-9-]+)/); steps.push({ icon: 'home', text: `Looked up the ${m[2]} layout: ${ids.length ? `${text.list(ids)} open` : 'open now'}.` }) }
      else if ((m = /^No (.+?) \((\w+)\) residences are open/.exec(res))) steps.push({ icon: 'home', text: `Looked up the ${m[2]} layout: none open.` })
      else {
        const ids = unitIdsIn(res, /^Unit ([A-Za-z0-9-]+)/), stretch = unitIdsIn(res, /Slightly above their range: Unit ([A-Za-z0-9-]+)/), later = unitIdsIn(res, /Coming up a bit later: Unit ([A-Za-z0-9-]+)/)
        let txt = ids.length ? `Checked what's available and told them about ${text.list(ids)}.` : "Checked what's available."
        if (stretch.length) txt += ` Mentioned ${text.list(stretch)} as a little over their budget.`
        if (later.length) txt += ` Mentioned ${text.list(later)} opening later.`
        steps.push({ icon: 'home', text: txt })
      }
    } else if (t.name === 'answer_question') {
      const q = String(t.args.question ?? '')
      if (/^That is something a member of the team/.test(res)) steps.push({ icon: 'hand', text: `Asked "${q}" — passed to a person; took their details.` })
      else if (/^That is live information/.test(res)) steps.push({ icon: 'message', text: `Asked "${q}" — checked the live list instead of answering from memory.` })
      else if (/^You do not have an approved answer/.test(res)) steps.push({ icon: 'message', text: `Asked "${q}" — no approved answer, so the assistant offered a call back rather than guess.${f.refused && f.refused.timesAsked >= 2 ? ' Asked twice.' : ''}` })
      else steps.push({ icon: 'message', text: `Answered "${q}" from ${label(labels.topic, t.args.topic, 'the approved information')}: "${text.truncate(text.staff(res.replace(/\s+/g, ' ').trim()), 140)}"` })
    } else if (t.name === 'list_tour_slots') {
      if (/^No tour times are open/.test(res)) steps.push({ icon: 'calendar', text: 'No tour times were open, so offered a call back.' })
      else steps.push({ icon: 'calendar', text: `Offered ${text.plural((res.match(/^slot-/gm) || []).length, 'tour time')}.` })
    } else if (t.name === 'book_tour') {
      if (/^You're all set/.test(res)) steps.push({ icon: 'calendar', text: `Booked a tour${t.args.unitId ? ` of apartment ${t.args.unitId}` : ''} for ${(f.booked && f.booked.when) || parseWhen(res) || 'a time on the calendar'}${t.args.prospectEmail ? `; confirmation to ${t.args.prospectEmail}` : ''}.` })
      else if (/^I'm getting that booked/.test(res)) steps.push({ icon: 'calendar', text: 'Started arranging a tour; not confirmed yet.' })
      else if (/^That time just went/.test(res)) steps.push({ icon: 'calendar', text: 'The time was taken while booking; offered other times.' })
      else if (/^I'm having trouble reaching the calendar/.test(res)) steps.push({ icon: 'hand', text: "Couldn't reach the calendar; flagged this for a call back." })
      else if (/^That slot is not on the calendar/.test(res)) steps.push({ icon: 'calendar', text: "Tried a time that wasn't on the calendar and was told to list real times." })
      else steps.push({ icon: 'calendar', text: 'Tried to book a tour.' })
    } else if (t.name === 'capture_loss_reason') {
      steps.push({ icon: 'x', text: `Noted it may not work out: ${lossText({ kind: t.args.kind, detail: t.args.detail })}${t.args.evidence ? ` ("${String(t.args.evidence)}")` : ''}.` })
    } else steps.push({ icon: 'x', text: "Tried something the assistant can't do." })
  }
  flushRun()

  return {
    who, wants, sentence, chips, facts, steps, findings: f,
    ended: call ? endedPhrase(call.endedReason) : '',
    needsPerson: needsPersonFlag, emergency: Boolean(f.emergency), dropped: f.dropped, booked: f.booked, restricted: f.restricted,
  }
}

// --- the to-do sentence (§6.3) ---------------------------------------------------------

function todoSentence(fu, profile, s) {
  const p = profile || profileByPhone(s || state, fu.phone) || { phone: fu.phone, name: null }
  const name = personName(p)
  const kind = String(fu.kind ?? '')
  const today = nyNow().ymd
  const verbFor = (ch) => label(labels.channelVerb, ch, 'Call')
  const bookingOn = (ymd) => arr(p.bookings).find((b) => b && b.status === 'confirmed' && nyDate(b.startsAt) === ymd) || null
  const tourPhrase = (b) => `${fmt.time(b.startsAt)} tour${b.unitId ? ` of apartment ${b.unitId}` : ''}`
  const dayWord = (ymd) => { const d = daysBetween(today, ymd); return d === 0 ? "today's" : d === 1 ? "tomorrow's" : `${WD_LONG[dayOfWeek(ymd)]}'s` }
  const reason = String(fu.reason ?? '')
  let verb = 'Call', before = 'Call ', after = '', needs = false, m
  if (kind === 'confirm_tour') {
    const tour = bookingOn(nyDate(fu.dueAt))
    if (tour) after = ` to confirm ${dayWord(nyDate(tour.startsAt))} ${tourPhrase(tour)}`
    else if ((m = /still coming at (\d{1,2}:\d{2} [AP]M)(?: to see (\S+?))?\.$/.exec(reason))) after = ` to confirm their ${m[1]} tour${m[2] ? ` of apartment ${m[2]}` : ''}`
    else after = ' to confirm their tour'
  } else if (kind === 'remind_tour') {
    verb = verbFor(fu.channel); before = `${verb} `
    const tour = bookingOn(addDays(nyDate(fu.dueAt) || today, 1))
    after = ` a reminder about tomorrow's ${tour ? tourPhrase(tour) : 'tour'}`
  } else if (kind === 'post_tour') {
    const past = arr(p.bookings).filter((b) => b && b.status === 'confirmed' && (toTime(b.startsAt) ?? Infinity) < Date.now()).sort((a, b) => (toTime(b.startsAt) ?? 0) - (toTime(a.startsAt) ?? 0))
    let unit = past.length ? past[0].unitId : null
    if (!unit && (m = /toured(?: residence (\S+?))? —/.exec(reason))) unit = m[1] || null
    after = ` — how did the tour${unit ? ` of apartment ${unit}` : ''} go? Do they want to apply?`
  } else if (kind === 'priced_out_watch') {
    verb = verbFor(fu.channel); before = `${verb} `
    const budget = p.signals && p.signals.budget && p.signals.budget.value
    if (budget != null && !isNaN(Number(budget))) after = ` if anything under ${fmt.money(budget)} opens up`
    else if ((m = /priced out \((.+?)\)/.exec(reason))) after = ` if anything in their range opens up (${text.staff(m[1])})`
    else after = ' if anything in their range opens up'
  } else if (kind === 'nurture') {
    after = " — interested but didn't book. Offer a tour again."
  } else if (kind === 'callback') {
    const q = callbackQuestion(fu, p)
    const t = escalationText({ trigger: q.trigger, detail: q.detail })
    after = ` back — ${t.headline}`; needs = true
  } else if (kind === 'collect_email') {
    if (p.name) { before = 'Get '; after = "'s email so the tour confirmation can go out" }
    else { before = 'Get an email address for '; after = ' so the tour confirmation can go out' }
  } else {
    verb = verbFor(fu.channel); before = `${verb} `
    after = reason ? ` — ${text.staff(reason)}` : ''
  }
  return { verb, before, name, after, text: `${before}${name}${after}`, needsPerson: needs, channel: String(fu.channel ?? 'call') }
}

function reread(resource) {
  if (!RESOURCES[resource] || gated) return Promise.resolve()
  return api.get(RESOURCES[resource]).then((d) => { apply(resource, d) }, () => { /* the poll will try again */ })
}
async function setFollowUpStatus(fu, status, opts) {
  const o = opts || {}
  if (!fu || !fu.id || busyNow('leads')) return false
  const btn = o.button || null
  const row = btn ? btn.closest('.row') : null
  const verb = o.verb || (status === 'done' ? 'done' : status === 'skipped' ? 'not needed' : 'back')
  if (btn) { btn.classList.add('is-busy'); btn.setAttribute('aria-busy', 'true') }
  if (row) row.classList.add('row-busy')
  try {
    const res = await busy('leads', api.post('/api/leads', { action: 'followup_status', id: fu.id, status }, { doing: `marking a to-do ${verb}` }))
    if (row && row.isConnected && status !== 'scheduled') { row.classList.add('row-leaving'); await new Promise((r) => setTimeout(r, 120)) }
    apply('leads', res)
    if (status === 'scheduled') toast('Put back on the list', { kind: 'ok', key: `fu:${fu.id}` })
    else toast(`Marked ${verb}`, { kind: 'ok', key: `fu:${fu.id}`, actions: [{ label: 'Undo', fn: () => busy('leads', api.post('/api/leads', { action: 'followup_status', id: fu.id, status: 'scheduled' }, { doing: 'undoing a to-do change' })).then((r) => { apply('leads', r) }) }] })
    return true
  } catch (e) {
    if (e.signedOut) return false
    if (btn && btn.isConnected) { btn.classList.remove('is-busy'); btn.removeAttribute('aria-busy') }
    if (row && row.isConnected) row.classList.remove('row-busy', 'row-leaving')
    if (e.status === 404) toast('That to-do was removed by someone else. The list has been refreshed.', { kind: 'warn' })
    else toast("Couldn't update that to-do. Nothing changed — try again.", { kind: 'error', actions: [{ label: 'Try again', fn: () => { setFollowUpStatus(fu, status, { verb }) } }] })
    reread('leads')
    return false
  }
}

const link = (name, params, txt, cls) => `<a class="${cls || 'btn btn-quiet'}" href="${esc(hashFor(name, params))}">${esc(txt)}</a>`
const telBtn = (phone, txt, cls) => { const h = href.tel(phone); return h ? `<a class="${cls || 'btn btn-call'}" href="${esc(h)}">${esc(txt || 'Call')}</a>` : '' }
const telLink = (phone) => { const h = href.tel(phone), shown = fmt.phone(phone); return h && shown ? `<a href="${esc(h)}">${esc(shown)}</a>` : esc(shown) }
const mailLink = (email) => { const h = href.mailto(email); return h ? `<a href="${esc(h)}">${esc(email)}</a>` : esc(email || '') }
const chipHtml = (c) => html_.chip(c.cls, c.icon, c.text)
const isAfterHours = (t) => { const p = nyParts(t); if (!p) return false; const h = property.hours[p.dayOfWeek]; if (!h) return true; const x = p.hour + p.minute / 60; return x < h[0] || x >= h[1] }
function sectionHead(title, count, trailing) {
  return `<div class="section-head"><h2>${esc(title)}${count != null ? ` <span class="count">· ${count}</span>` : ''}</h2>${trailing || ''}</div>`
}

function todayModel(s) {
  const now = Date.now(), today = nyNow().ymd, tomorrow = addDays(today, 1)
  const ws = windowStart(), wsT = toTime(ws)
  const records = callRecords(s)
  const needs = needsPerson(s)
  const emergencies = needs.filter((n) => n.type === 'emergency')
  const people = needs.filter((n) => n.type !== 'emergency')
  const callBacks = callBackToday(s)
  const tours = toursOn(s, today), toursTomorrow = toursOn(s, tomorrow)
  const callsKnown = s.loaded.calls || s.loaded.leads
  let callIds = 0, afterHours = 0
  for (const r of records) { const t = toTime(r.startedAt); if (t != null && t >= wsT) { callIds++; if (isAfterHours(t)) afterHours++ } }
  const allTwenty = arr(s.calls).length >= 20 && arr(s.calls).every((c) => (toTime(c.startedAt) ?? 0) >= wsT)
  const callsValue = !callsKnown ? '—' : (allTwenty ? '20+' : String(callIds))
  const callsNote = !callsKnown ? '' : (s.callsConfigured === false && callIds === 0 ? 'notConnected' : (afterHours ? `${afterHours} after hours` : ''))
  let toursBooked = null
  if (s.calendar) toursBooked = arr(s.calendar.bookings).filter((b) => b && (toTime(b.bookedAt) ?? 0) >= wsT).length
  else if (s.loaded.leads) {
    toursBooked = 0
    for (const p of profilesOf(s)) for (const b of arr(p.bookings)) if (b && b.status === 'confirmed' && (toTime(callAt(p, b.callId)) ?? 0) >= wsT) toursBooked++
  }
  const nextTour = tours.find((t) => !t.past)
  const needValue = s.loaded.leads ? needs.length : null
  const oldest = needs.length ? Math.min(...needs.map((n) => toTime(n.at) ?? now)) : null
  const leadsStore = s.leads && s.leads.store, calStore = s.calendar && s.calendar.store
  const leadsOff = Boolean(leadsStore) && leadsStore.durable === false, calOff = Boolean(calStore) && calStore.durable === false
  let briefing = ''
  if (callsKnown) {
    if (callsValue === '0') briefing = 'Since 6 PM yesterday: no calls yet.'
    else {
      const toursPart = toursBooked == null ? '' : `, ${toursBooked === 0 ? 'no tours booked' : text.plural(toursBooked, 'tour booked', 'tours booked')}`
      const n = needs.length + callBacks.length
      briefing = n === 0 ? `Since 6 PM yesterday: ${text.plural(callsValue === '20+' ? 20 : Number(callsValue), 'call').replace(/^20 /, '20+ ')}${toursPart}. Nothing needs you right now.`
        : `Since 6 PM yesterday: ${text.plural(callsValue === '20+' ? 20 : Number(callsValue), 'call').replace(/^20 /, '20+ ')}${toursPart}, ${text.plural(n, 'person to call back', 'people to call back')}.`
      if (callsValue === '20+') briefing = briefing.replace('20+ calls', '20+ calls')
    }
  }
  return {
    today, now, ws, records, needs, emergencies, people, callBacks, tours, toursTomorrow, callsKnown, callsValue, callsNote, toursBooked,
    nextTour: nextTour ? fmt.time(nextTour.startsAt) : null, needValue, oldest, leadsOff, calOff, briefing,
    errors: { calls: Boolean(s.errors.calls), calendar: Boolean(s.errors.calendar), leads: Boolean(s.errors.leads) },
    loaded: { ...s.loaded }, notConfigured: s.notConfigured, callsConfigured: s.callsConfigured,
  }
}

    if (!fu) return
    if (btn.dataset.action === 'done') setFollowUpStatus(fu, 'done', { button: btn })
    else if (btn.dataset.action === 'skip') setFollowUpStatus(fu, 'skipped', { verb: 'not needed', button: btn })
    else if (btn.dataset.action === 'handled') setFollowUpStatus(fu, 'done', { verb: 'handled', button: btn })
  },
  render(s) {
    const root = this.root
    if (!root) return
    const m = todayModel(s)
    const key = JSON.stringify([m.callsValue, m.callsNote, m.toursBooked, m.nextTour, m.needValue, m.oldest, m.leadsOff, m.calOff, m.briefing, m.errors, m.loaded, m.notConfigured, m.callsConfigured,
      m.emergencies.map((x) => [x.callId, x.at, x.matched]), m.people.map((x) => [x.type, x.callId, x.respondBy, x.calledAt, fmt.respondPhrase(x.respondBy), x.question, x.name]),
      m.callBacks.map((f) => [f.id, f.dueAt, f.status, fmt.duePhrase(f.dueAt), todoSentence(f, profileByPhone(s, f.phone), s).text]),
      m.tours.map((t) => [t.slotId, t.name, t.unitId, t.past, t.phone]), m.toursTomorrow.length,
      m.records.slice(0, 5).map((r) => [r.id, r.displayName, fmt.dateTime(r.startedAt), callStory(r, s).sentence]), busyNow('leads')])
    if (key === this.sigKey) return
    this.sigKey = key
    const focusKey = root.contains(document.activeElement) && document.activeElement.dataset ? document.activeElement.dataset.key : null
    const loading = !m.callsKnown && !s.loaded.calendar && !m.errors.calls && !m.errors.leads
    let out = `<div class="view-head"><h1 tabindex="-1">Today</h1><p class="dateline small muted">${esc(fmt.dayLong(m.today))} · ${esc(property.name)}</p>${m.briefing ? `<p class="briefing muted">${esc(m.briefing)}</p>` : ''}</div>`
    if (m.notConfigured) { root.innerHTML = out; return }
    out += m.emergencies.map((x) => emergencyBannerHtml(x, this.announced)).join('')
    if (m.leadsOff || m.calOff) {
      const txt = m.leadsOff && m.calOff ? "Heads up: changes aren't being saved right now. Anything you mark may disappear. Ask Atrium support."
        : m.leadsOff ? "Heads up: callers and to-dos aren't being saved right now. Anything you mark here may disappear. Ask Atrium support."
          : "Heads up: calendar changes aren't being saved right now. Blocks you add may disappear. Ask Atrium support."
      out += html_.banner('warn', '', { raw: `<a class="banner-link" href="#/status" style="color:inherit;text-decoration:none">${esc(txt)}</a>` })
    }
    out += `<p class="label muted" style="margin-top:${m.emergencies.length || m.leadsOff || m.calOff ? '16px' : '0'}">Since 6 PM yesterday</p>`
    if (loading) {
      out += `<div class="tiles" aria-busy="true"><span class="vh">Loading today…</span><div class="skeleton-tile skeleton-row"></div><div class="skeleton-tile skeleton-row"></div><div class="skeleton-tile skeleton-row"></div></div>`
      for (const title of ['Needs a person', 'Call back today', 'Tours today']) out += `<section class="section">${sectionHead(title)}${html_.skeletonRows(2)}</section>`
      root.innerHTML = out
      return
    }
    const tile = (label_, value, note, extra) => `<a class="card big-number${extra || ''}" href="${esc(extra === ' big-number-warn' || label_.includes('person') ? '#needs-a-person' : (label_ === 'Calls' ? '#/calls' : '#/calendar'))}" data-key="tile:${esc(label_)}"><span class="big-number-label">${esc(label_)}</span><span class="big-number-value num">${esc(value)}</span><span class="big-number-note">${note}</span></a>`
    const callsNote = m.callsNote === 'notConnected' ? `<a href="#/status" class="link">Call history isn't connected</a>` : esc(m.callsNote || '')
    const toursVal = m.toursBooked == null ? '—' : String(m.toursBooked)
    const needVal = m.needValue == null ? '—' : String(m.needValue)
    out += `<div class="tiles">${tile('Calls', m.callsValue === '—' ? '—' : m.callsValue, callsNote)}` +
      `${tile(m.toursBooked === 1 ? 'Tour booked' : 'Tours booked', toursVal, esc(m.toursBooked == null ? '' : (m.nextTour ? `next one ${m.nextTour}` : 'none today')))}` +
      `${tile(m.needValue === 1 ? 'Needs a person' : 'Need a person', needVal, esc(m.needValue == null ? '' : (m.needs.length ? `oldest waiting ${fmt.elapsed(m.now - m.oldest)}` : 'all handled')), m.needValue > 0 ? ' big-number-warn' : '')}</div>`
    // Needs a person
    out += `<section class="section today-list" id="needs-a-person">${sectionHead('Needs a person', m.people.length)}`
    out += pollBanner(s, 'leads', 'callers')
    if (m.people.length) out += `<div class="card card-warn rows">${m.people.map((p) => personRowHtml(p, s)).join('')}</div>`
    else if (s.loaded.leads) out += `<div class="card">${html_.empty({ title: 'Nothing needs a person right now.', text: "When the assistant hands something off — an accommodation question, a dispute, a tour it couldn't book — it shows up here." })}</div>`
    out += '</section>'
    // Call back today
    const more = m.callBacks.length > 6 ? link('leads', { tab: 'todo' }, `See all ${m.callBacks.length} in Leads ›`, 'btn-link') : ''
    out += `<section class="section today-list">${sectionHead('Call back today', m.callBacks.length, more)}`
    if (!m.people.length) out += pollBanner(s, 'leads', 'callers')
    if (m.callBacks.length) out += `<div class="card rows">${m.callBacks.slice(0, 6).map((f) => followUpRowHtml(f, s)).join('')}</div>`
    else if (s.loaded.leads) out += `<div class="card">${html_.empty({ title: 'No one to call back today.', text: "To-dos the assistant creates — a tour to confirm, a question it couldn't answer — appear here on the day they're due." })}</div>`
    out += '</section>'
    // Tours today
    const tomorrowLink = m.toursTomorrow.length ? link('calendar', { date: addDays(m.today, 1) }, `Tomorrow: ${text.plural(m.toursTomorrow.length, 'tour')} ›`, 'btn-link') : ''
    out += `<section class="section today-list">${sectionHead('Tours today', m.tours.length, tomorrowLink)}`
    out += pollBanner(s, 'calendar', 'the calendar')
    if (m.tours.length) out += `<div class="card rows">${m.tours.map((t) => tourRowHtml(t, s, m.today)).join('')}</div>`
    else if (s.loaded.calendar || s.loaded.leads) out += `<div class="card">${html_.empty({ title: 'No tours today.', text: "When the assistant books one, it shows up here with the caller's name and apartment." })}</div>`
    out += '</section>'
    // Recent calls
    out += `<section class="section today-list">${sectionHead('Recent calls', null, link('calls', {}, 'All calls ›', 'btn-link'))}`
    out += pollBanner(s, 'calls', 'calls')
    if (s.callsConfigured === false) out += html_.banner('info', "Call recordings and transcripts aren't connected, so this list is built from the assistant's notes.")
    if (m.records.length) out += `<div class="card rows">${m.records.slice(0, 5).map((r) => recentCallRowHtml(r, s)).join('')}</div>`
    else if (s.loaded.calls || s.loaded.leads) out += `<div class="card">${html_.empty({ title: 'No calls yet.', text: 'Calls to the leasing line show up here within a minute of ending.' })}</div>`
    out += '</section>'
    root.innerHTML = out
    if (focusKey) { const el = root.querySelector(`[data-key="${cssq(focusKey)}"]`); if (el) { try { el.focus({ preventScroll: true }) } catch (e) { /* ignore */ } } }
    paintBusy('leads')
  },
  badge(s) { return needsPerson(s).length || null },
}
// The "Need a person" tile scrolls to its section rather than switching views.
document.addEventListener('click', (e) => {
  const a = e.target.closest('a[href="#needs-a-person"]')
  if (!a) return
  e.preventDefault()
  const sec = document.getElementById('needs-a-person')
  if (!sec) return
  sec.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' })
  const h = sec.querySelector('h2'); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }) }
})

// ---------------------------------------------------------------------------------------
// Status and Demo tools (§11)
// ---------------------------------------------------------------------------------------

const ASSISTANT_PARA = "It answers the leasing line, learns what a caller is looking for, quotes only the apartments on the live availability list, answers questions from the approved building information, offers real tour times and books them on this calendar. It doesn't guess: if it hasn't been told something, it says so and offers a call back. It never handles accommodation requests, fair-housing or legal questions, disputes, eligibility or payments — those always go to a person, and you'll see them under \"Needs a person\". If a caller reports an emergency it tells them to leave and call 911, then flags it on Today. It doesn't make outgoing calls or send messages yet."

function storeLine(store) {
  if (!store) return 'not loaded yet'
  return `${String(store.kind ?? '?')} · ${store.durable ? 'durable' : 'not durable'} · "${String(store.note ?? '')}"`
}
const statusView = {
  title: 'Status', icon: icons.status, root: null, sigKey: null, busyAction: false, demoFocused: null,
  mount(root) {
    this.root = root
    root.addEventListener('click', (e) => this.onClick(e))
    const repaint = () => { if (this.root && !this.root.hidden) this.render(state) }
    on('data', repaint); on('poll', repaint); on('minute', repaint)
  },
  render(s) {
    const root = this.root
    if (!root || this.busyAction) return
    const rows = statusRows()
    const at = s.updatedAt ? fmt.time(s.updatedAt) : ''
    const counts = { calls: arr(s.calls).length, slots: arr(s.calendar && s.calendar.slots).length, leads: profilesOf(s).length, todos: followUpsOf(s).length }
    const model = { rows, at, errors: s.errors, lastWriteError: s.lastWriteError, health: s.health, counts, lastPollAt: s.lastPollAt, lstore: s.leads && s.leads.store, cstore: s.calendar && s.calendar.store,
      callsError: s.callsError, callsConfigured: s.callsConfigured, outbound: Boolean(s.leads && s.leads.outboundEnabled), notConfigured: s.notConfigured, weekDays: this.weekDays(s).length, calLoaded: Boolean(s.calendar) }
    const key = JSON.stringify(model)
    if (key === this.sigKey) return
    this.sigKey = key
    const focusKey = root.contains(document.activeElement) && document.activeElement.dataset ? document.activeElement.dataset.key : null
    const savingRow = (labelText, v) => {
      if (v === null) return `<div class="status-row"><span class="dot dot-neutral"></span><span class="muted">${esc(labelText)}: not loaded yet</span></div>`
      const off = v !== 'on'
      const word = v === 'on' ? 'Saving on' : v === 'temp' ? 'Saving temporarily off — Atrium has been told' : 'Saving off — changes may be lost'
      return `<div class="status-row"><span class="dot${off ? ' dot-warn' : ''}"></span><span class="${off ? 'warn-text' : ''}">${off ? ico('cloud-off') : ico('check')} ${esc(labelText)}: ${esc(word)}</span></div>`
    }
    const rec = rows.recordings
    const recText = rec === null ? 'Checking…' : rec === 'on' ? 'Connected — recordings and transcripts are available for the 20 most recent calls.'
      : rec === 'off' ? "Not connected yet — calls still show from the leads' records, without recordings or transcripts. Ask Atrium support." : 'Connected, but not answering right now — trying again.'
    const summaryOk = rows.ok
    let out = `<div class="view-head"><h1 tabindex="-1">Status</h1></div><div class="status-col">`
    out += `<div class="card status-summary ${summaryOk ? 'is-ok' : 'is-warn'}"><div style="display:flex;gap:10px;min-width:0">${ico(summaryOk ? 'check-circle' : 'warning')}<div><div class="summary-title">${summaryOk ? 'Everything is working.' : 'Something needs attention.'}</div>` +
      `<div class="summary-sub">${rows.reconnecting ? `Trying to reconnect…${at ? ` showing what we had at ${esc(at)}` : ''}` : (at ? `Updated ${esc(at)}` : 'Loading…')}</div></div></div>` +
      `<button type="button" class="btn" data-action="refresh" data-key="refresh">Refresh now</button></div>`
    out += `<section class="status-section"><h2>Saving</h2>${savingRow('Callers and to-dos', rows.leadsSaving)}${savingRow('Calendar', rows.calendarSaving)}` +
      (rows.leadsSaving === 'off' || rows.calendarSaving === 'off' ? `<p class="status-p muted small">Ask Atrium support to turn saving on.</p>` : '') + '</section>'
    out += `<section class="status-section"><h2>Call recordings and transcripts</h2><div class="status-row"><span class="dot${rec === 'on' ? '' : rec === null ? ' dot-neutral' : ' dot-warn'}"></span><span class="${rec === 'on' || rec === null ? '' : 'warn-text'}">${esc(recText)}</span></div></section>`
    out += `<section class="status-section"><h2>Outgoing calls</h2><div class="status-row"><span class="dot dot-neutral"></span><span>${model.outbound ? 'The assistant can make outgoing calls.' : "The assistant answers calls; it doesn't make them. Everything under To do is for your team."}</span></div></section>`
    out += `<section class="status-section"><h2>Times</h2><p class="status-p">All times on this page are New York time.</p></section>`
    out += `<section class="status-section"><h2>Signed in</h2><p class="status-p">You're signed in on this device. Sessions end after 8 hours; you'll be asked for the passcode again.</p><div class="status-actions"><button type="button" class="btn" data-action="signout" data-key="signout">Sign out</button></div></section>`
    out += `<section class="status-section"><h2>Who can see this</h2><p class="status-p">This page has callers' names, numbers and what they said. Keep it to the leasing team, don't screenshot it into a shared channel, and sign out when you're done.</p></section>`
    out += `<section class="status-section"><h2>What the assistant does and doesn't do</h2><p class="status-p">${esc(ASSISTANT_PARA)}</p></section>`
    const support = []
    support.push(['Callers and to-dos', storeLine(model.lstore)])
    support.push(['Calendar', storeLine(model.cstore)])
    support.push(['Call history', s.callsError ? `"${s.callsError}"` : (s.callsConfigured === true ? 'connected' : 'not loaded yet')])
    support.push(['Last error', s.lastWriteError ? `"${s.lastWriteError.message}" · ${fmt.dateTime(s.lastWriteError.at)}${s.lastWriteError.doing ? ` · ${s.lastWriteError.doing}` : ''}` : 'none'])
    support.push(['Last refresh', s.lastPollAt ? `${s.lastPollAt} · calls ${counts.calls} · slots ${counts.slots} · leads ${counts.leads} · to-dos ${counts.todos}` : 'not yet'])
    for (const [name, err] of Object.entries(s.errors)) support.push([`Can't load ${name}`, `"${err.message}"${err.status ? ` · HTTP ${err.status}` : ''} · ${fmt.dateTime(err.at)}`])
    if (s.health) support.push(['Health check', `${s.health.store} · ${s.health.durable ? 'durable' : 'not durable'} · call history ${s.health.callHistory ? 'on' : 'off'} · "${s.health.hint}"`])
    out += `<details class="support status-section"><summary>${ico('chevron-down')}For support</summary><dl class="facts">${support.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></details>`
    const weekN = model.weekDays
    out += `<section class="card card-demo status-section" id="demo-tools"><div class="demo-head" tabindex="-1" data-key="demo-head">${ico('warning')}<span>Demo tools</span></div><p class="demo-standing">These are for demos and testing. They change real data.</p>` +
      `<div class="demo-row"><p>Try it: call the leasing line and the call shows up on Today within a minute.</p><a class="btn" href="${esc(href.tel(property.leasingPhone))}">Call ${esc(property.leasingPhoneDisplay)}</a></div>` +
      `<div class="demo-row"><p>Blocks every remaining day of this week so a caller is told there's nothing available.</p><button type="button" class="btn" data-action="block-week" data-key="block-week" data-write="calendar"${model.calLoaded && weekN ? '' : ' aria-disabled="true"'}>Block the rest of this week</button><div class="demo-progress" hidden></div></div>` +
      `<div class="demo-row"><p>Removes every tour from the calendar, including real ones. Only for resetting a demo.</p><button type="button" class="btn btn-danger" data-action="clear-bookings" data-key="clear-bookings" data-write="calendar">Delete all tours</button></div>` +
      `<div class="demo-row"><p>Removes every caller and to-do so you can run a fresh demo. Don't use this with real callers.</p><button type="button" class="btn btn-danger" data-action="clear-leads" data-key="clear-leads" data-write="leads">Delete all callers</button></div></section></div>`
    root.innerHTML = out
    if (focusKey) { const el = root.querySelector(`[data-key="${cssq(focusKey)}"]`); if (el) { try { el.focus({ preventScroll: true }) } catch (e) { /* ignore */ } } }
    paintBusy('leads'); paintBusy('calendar')
    const r = route()
    if (r.name === 'status' && r.params.section === 'demo' && this.demoFocused !== location.hash) {
      this.demoFocused = location.hash
      const head = root.querySelector('.demo-head')
      if (head) { head.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); head.focus({ preventScroll: true }) }
    }
  },
  /** NY dates from today through this Saturday that have slots. */
  weekDays(s) {
    const cal = s.calendar
    if (!cal) return []
    const today = nyNow().ymd, dow = dayOfWeek(today)
    const days = []
    for (let i = 0; dow + i <= 6; i++) days.push(addDays(today, i))
    const withSlots = new Set(arr(cal.slots).map((x) => x && x.date))
    return days.filter((d) => withSlots.has(d))
  },
  onClick(e) {
    const btn = e.target.closest('button[data-action]')
    if (!btn || btn.getAttribute('aria-disabled') === 'true' || btn.classList.contains('is-busy')) return
    const a = btn.dataset.action
    if (a === 'refresh') this.refreshNow(btn)
    else if (a === 'signout') this.signOut(btn)
    else if (a === 'block-week') this.blockWeek(btn)
    else if (a === 'clear-bookings') this.clearBookings(btn)
    else if (a === 'clear-leads') this.clearLeads(btn)
  },
  async refreshNow(btn) {
    this.busyAction = true
    btn.classList.add('is-busy'); btn.setAttribute('aria-busy', 'true')
    try { await refresh() } finally { this.busyAction = false; this.sigKey = null; this.render(state) }
  },
  async signOut(btn) {
    btn.classList.add('is-busy'); btn.setAttribute('aria-busy', 'true')
    stopPolling(); gated = true
    try {
      await fetch('/api/dashboard', { method: 'POST', credentials: 'same-origin', cache: 'no-store', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action: 'logout' }) })
    } catch (e) { /* the reload lands on the sign-in page either way */ }
    location.reload()
  },
  async blockWeek(btn) {
    const days = this.weekDays(state)
    if (!days.length) { toast("The calendar isn't reachable right now.", { kind: 'warn' }); return }
    const reason = await prompt('Reason (optional)', { title: 'Block the rest of this week?', placeholder: 'e.g. demo', confirmLabel: `Block ${text.plural(days.length, 'day')}`, intro: "Callers will be told there's nothing open. Tours already booked stay." })
    if (reason === null) return
    await this.blockDays(days, reason.trim().slice(0, 120))
  },
  async blockDays(days, reason) {
    const root = this.root
    const btn = root.querySelector('[data-action="block-week"]'), progress = root.querySelector('.demo-progress')
    this.busyAction = true
    if (btn) { btn.classList.add('is-busy'); btn.setAttribute('aria-busy', 'true') }
    const blocked = []
    let failedDay = null, signedOutNow = false
    await busy('calendar', (async () => {
      for (const d of days) {
        if (progress) { progress.hidden = false; progress.textContent = `Blocking ${WD_LONG[dayOfWeek(d)]}…` }
        try {
          const body = { action: 'block', target: d }
          if (reason) body.reason = reason
          const res = await api.post('/api/calendar', body, { doing: 'blocking the rest of the week' })
          apply('calendar', res)
          blocked.push(d)
        } catch (e) { if (e.signedOut) { signedOutNow = true; return } failedDay = d; break }
      }
    })())
    this.busyAction = false
    if (signedOutNow) return
    if (progress) { progress.hidden = true; progress.textContent = '' }
    if (btn && btn.isConnected) { btn.classList.remove('is-busy'); btn.removeAttribute('aria-busy') }
    const long = (d) => WD_LONG[dayOfWeek(d)], short = (d) => WD[dayOfWeek(d)]
    if (!failedDay) toast(blocked.length > 1 ? `Blocked ${short(blocked[0])} – ${short(blocked[blocked.length - 1])}` : `Blocked ${long(blocked[0])}`, { kind: 'ok' })
    else {
      const idx = days.indexOf(failedDay), rest = days.slice(idx)
      const retry = { label: 'Try again', fn: () => { this.blockDays(rest, reason) } }
      if (!blocked.length) toast("Couldn't do that. Nothing changed — try again.", { kind: 'error', actions: [retry] })
      else toast(`Couldn't block ${long(failedDay)}. ${text.list(blocked.map(long))} ${blocked.length > 1 ? 'are' : 'is'} blocked${days[idx + 1] ? `; ${long(days[idx + 1])} onward isn't` : ''}.`, { kind: 'error', actions: [retry] })
      reread('calendar')
    }
    this.sigKey = null; this.render(state)
  },
  async clearBookings(btn) {
    const ok = await confirm('This removes every tour on the calendar, including real ones. Only for resetting a demo.', { title: 'Delete every tour?', confirmLabel: 'Delete all tours', danger: true })
    if (!ok) return
    btn.classList.add('is-busy'); btn.setAttribute('aria-busy', 'true')
    try {
      const res = await busy('calendar', api.post('/api/calendar', { action: 'clear_bookings' }, { doing: 'deleting all tours' }))
      apply('calendar', res)
      toast('Deleted all tours', { kind: 'ok' })
    } catch (e) {
      if (e.signedOut) return
      toast("Couldn't do that. Nothing changed — try again.", { kind: 'error' })
      reread('calendar')
    } finally { if (btn.isConnected) { btn.classList.remove('is-busy'); btn.removeAttribute('aria-busy') } }
  },
  async clearLeads(btn) {
    const ok = await confirm('This removes every caller and every to-do, including real ones. Only for resetting a demo.', { title: 'Delete every caller and to-do?', confirmLabel: 'Delete all callers', danger: true })
    if (!ok) return
    btn.classList.add('is-busy'); btn.setAttribute('aria-busy', 'true')
    try {
      await busy('leads', api.post('/api/leads', { action: 'clear_leads' }, { doing: 'deleting all callers' }))
      apply('leads', { profiles: [], followUps: [] })
      toast('Deleted all callers and to-dos', { kind: 'ok' })
    } catch (e) {
      if (e.signedOut) return
      toast("Couldn't do that. Nothing changed — try again.", { kind: 'error' })
      reread('leads')
    } finally { if (btn.isConnected) { btn.classList.remove('is-busy'); btn.removeAttribute('aria-busy') } }
  },
}

// ---------------------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------------------

function boot() {
  if (booted) return
  booted = true
  for (const el of document.querySelectorAll('[data-icon]')) el.innerHTML = icon(el.dataset.icon)
  register('today', todayView)
  register('status', statusView)
  paintChrome()
  applyRoute()
  window.addEventListener('hashchange', applyRoute)
  document.addEventListener('visibilitychange', () => { if (!document.hidden) pollSoon() })
  window.addEventListener('focus', pollSoon)
  setInterval(() => { emit('minute', state); paintChrome() }, 60000)
  startPolling()
  fetchHealth().then(paintChrome)
}

window.Atrium = {
  escapeHtml, fmt, api, gate, toast, confirm, prompt, dialog, register, navigate, route, hashFor, state, on,
  busy, busyNow, apply, refresh, icons, icon, property, normalisePhone, labels, label, derive, hint, text, href,
  html: html_, announce, escape: escape_, setFollowUpStatus, boot, views: VIEWS.slice(),
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot)
else boot()
})()
</script>
<script>
/*
 * Calls view (brief §8). Owner: shell. Registers 'calls' on window.Atrium and renders into the
 * root the shell hands it: search + filter chips, the list grouped by New York day, and the
 * detail panel (split ≥ 1200 px, a full page with "‹ Calls" below). The story, steps, facts and
 * chips come from Atrium.derive.callStory; nothing here calls fetch.
 */
(function () {
'use strict'
const A = window.Atrium
if (!A) return
const esc = A.escapeHtml

const ico = (n) => `<span class="ico">${A.icon(n)}</span>`
const cssq = (s) => (window.CSS && CSS.escape) ? CSS.escape(String(s)) : String(s).replace(/["\\]/g, (c) => '\\' + c)
const FILTERS = [['all', 'All'], ['person', 'Needs a person'], ['booked', 'Tour booked'], ['priced', 'Priced out'], ['emergency', 'Emergency']]

const hasChip = (story, name) => story.chips.some((c) => c.text === name)

function matches(rec, story, q) {
  if (!q) return true
  const digits = q.replace(/\D/g, '')
  if (digits.length >= 2 && String(rec.phone || '').replace(/\D/g, '').includes(digits)) return true
  const f = story.findings
  const hay = [rec.displayName, rec.name, rec.profile && rec.profile.email, story.sentence, story.wants, rec.call && rec.call.transcript,
    ...(rec.profile ? rec.profile.unitsDiscussed || [] : []), ...f.units, ...f.stretch, ...f.later, story.booked && story.booked.unitId,
    ...story.facts.map((x) => `${x.value || ''} ${x.excerpt || ''}`), ...story.steps.map((x) => x.text)]
    .filter(Boolean).join('\n').toLowerCase()

}
function dayLabel(ymd, today) {

  if (ymd === today) return 'Today'

function rowHtml(rec, story, open, tab, isNew) {

  const cls = story.emergency ? 'row-siren' : story.needsPerson ? 'row-hand' : ''
  const dur = rec.durationSeconds != null ? fmt.duration(rec.durationSeconds) : '—'
  const phone = rec.name ? fmt.phone(rec.phone) : ''
  const time = rec.startedAt ? fmt.time(rec.startedAt) : ''
  const whenDesk = [time, dur !== '—' ? dur : ''].filter(Boolean).join(' · ')
  const whenMobile = [rec.startedAt ? fmt.dateTime(rec.startedAt) : '', dur !== '—' ? dur : ''].filter(Boolean).join(' · ')
  return `<button type="button" class="row row-click call-row ${cls}${isNew ? ' row-new' : ''}" data-key="row:${esc(rec.id)}" data-id="${esc(rec.id)}" aria-current="${open ? 'true' : 'false'}" tabindex="${tab ? '0' : '-1'}">` +
    `<span class="row-lead"><span class="row-lead-icon">${ico(iconName)}</span></span>` +
    `<span class="row-body"><span class="row-title"><span class="who">${esc(rec.displayName)}</span>${phone ? `<span class="phone">· ${esc(phone)}</span>` : ''}` +
    `<span class="when when-desk num">${esc(whenDesk)}</span><span class="when when-mobile num">${esc(whenMobile)}</span></span>` +
    `<span class="row-sub">${esc(story.sentence)}</span>` +
    (story.chips.length ? `<span class="row-chips">${story.chips.slice(0, 2).map((c) => A.html.chip(c.cls, c.icon, c.text)).join('')}</span>` : '') +
    `</span></button>`

function bubbleRuns(transcript) {
  const runs = []
  let cur = null
  for (const raw of String(transcript ?? '').split('\n')) {
    const line = raw.replace(/\s+$/, '')
    if (!line.trim()) continue
    let speaker = null, txt = line
    if (/^AI:\s?/.test(line)) { speaker = 'assistant'; txt = line.replace(/^AI:\s?/, '') }
    else if (/^User:\s?/.test(line)) { speaker = 'caller'; txt = line.replace(/^User:\s?/, '') }
    if (speaker === null) { if (cur) { cur.texts.push(txt); continue } speaker = 'caller' }
    if (cur && cur.speaker === speaker) cur.texts.push(txt)
    else { cur = { speaker, texts: [txt] }; runs.push(cur) }
  }
  return runs
}
function supportHtml(rec) {
  const call = rec.call
  const pairs = [['Call id', rec.id]]
  if (call) {
    pairs.push(['Started', String(call.startedAt ?? '—')])
    pairs.push(['Ended because', String(call.endedReason ?? '—')])
    if (call.cost != null && !isNaN(Number(call.cost))) pairs.push(['Cost', "$" + Number(call.cost).toFixed(2)])
  }
  let out = pairs.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')
  if (call) for (const tc of call.toolCalls || []) {
    const args = tc && tc.arguments && typeof tc.arguments === 'object' ? tc.arguments : {}
    const argText = Object.entries(args).map(([k, v]) => `${k}: ${typeof v === 'string' ? v : JSON.stringify(v)}`).join(' · ')
    const result = tc && tc.result == null ? 'no result came back' : text.truncate(String(tc.result), 600)
    out += `<dt>Tool</dt><dd>${esc(String((tc && tc.name) ?? 'unknown'))}${argText ? `<br>${esc(argText)}` : ''}<p>${esc(result)}</p></dd>`

function panelHtml(rec, story, s) {

  let out = `<div class="panel-head"><button type="button" class="btn btn-quiet panel-back" data-action="close">${ico('chevron-left')}Calls</button>` +
    `<h2 tabindex="-1" data-key="panel-title">${esc(rec.displayName)}</h2>` +
    (rec.profile ? `<a class="btn btn-quiet" href="${esc(A.hashFor('leads', { phone: rec.profile.phone }))}">Open lead</a>` : '') +
    `<button type="button" class="btn-icon btn-quiet panel-close" aria-label="Close" data-action="close">${A.icon('x')}</button></div><div class="panel-body">`
  if (story.emergency) {

    out += A.html.banner('danger', '', { raw: `<strong>Emergency — ${esc(em.phrase)}</strong> reported by ${phone ? esc(phone) : 'a caller with a hidden number'}${rec.startedAt ? ` at ${esc(fmt.dateTime(rec.startedAt))}` : ''}.${em.matched ? ` They said "${esc(em.matched)}".` : ''} The assistant told them to leave and call 911.`, icon: 'siren' }) + '<div style="height:12px"></div>'

  if (!call) out += `<div style="margin-top:12px">${A.html.banner('info', 'Only the 20 most recent calls have transcripts and recordings. This is what was kept about this one.')}</div>`
  out += `<section class="panel-section"><h3>What happened</h3><p class="story prose">${esc([story.who, story.wants, story.sentence].filter(Boolean).join(' '))}</p>` +
    (story.dropped ? `<p class="muted small" style="margin-top:6px">The call seems to have dropped partway through — the last step never finished.</p>` : '') +
    (story.chips.length ? `<div class="chips">${story.chips.map((c) => A.html.chip(c.cls, c.icon, c.text)).join('')}</div>` : '') + '</section>'

    else handling = '<span>Handled — a person marked this done.</span>'

      (t ? `<div class="${t.quote === null ? 'quote' : ''}">${t.quote === null ? esc(t.headline.replace(/^asked /, '')) : esc(text.capitalise(t.headline))}</div>${t.quote ? `<div class="quote">"${esc(t.quote)}"</div>` : ''}<div class="reassure">${esc(t.reassurance)}</div>`
        : `<div>They wanted a tour but it couldn't be booked.</div><div class="reassure">The assistant said someone would call back with times.</div>`) +
      `<div class="handling">${handling}</div></div></section>`
  }
  out += `<section class="panel-section"><h3>What the assistant learned</h3>`
  if (story.facts.length) {
    out += `<dl class="facts">${story.facts.map((f) => f.unreadable
      ? `<dt>${esc(f.label)}</dt><dd>Couldn't make out their ${esc(A.label(A.labels.signalShort, f.signal, 'answer'))} from "${esc(f.value)}" — asked again.</dd>`
      : `<dt>${esc(f.label)}</dt><dd>${esc(f.value)}${f.excerpt ? ` — <span class="quote">"${esc(f.excerpt)}"</span>` : ''}</dd>`).join('')}</dl>`
  } else out += `<p class="muted">The assistant didn't need to ask what they were looking for on this call.</p>`
  out += '</section>'
  out += `<section class="panel-section"><h3>What the assistant did</h3>`
  if (story.steps.length) out += `<ol class="steps">${story.steps.map((st) => `<li>${ico(st.icon)}<span>${esc(st.text)}</span></li>`).join('')}</ol>`
  else out += `<p class="muted">The assistant answered without needing to look anything up.</p>`
  out += '</section>'
  const transcript = call && call.transcript ? String(call.transcript) : ''
  if (transcript.trim()) {
    const runs = bubbleRuns(transcript)
    const lines = transcript.split('\n').filter((l) => l.trim()).length
    const open = isDesktop() && lines <= 40
    out += `<details class="panel-section convo" data-key="convo"${open ? ' open' : ''}><summary><h3>Conversation</h3>${ico('chevron-down')}</summary><div class="bubbles">` +
      runs.map((r) => `<div class="bubble-run ${r.speaker}"><span class="bubble-label">${r.speaker === 'caller' ? 'Caller' : 'Assistant'}</span><div class="bubble">${esc(r.texts.join('\n'))}</div></div>`).join('') + '</div></details>'
  } else if (call) {
    out += `<section class="panel-section"><h3>Conversation</h3><p class="muted">No transcript was saved for this call.${s.callsConfigured === false ? ' Transcripts aren\'t connected yet — see Status.' : ''}</p></section>`
  }

const view = {

  q: '', filter: 'all', openId: null, listHtml: null, panelHtml: null, bannerHtml: null, prevIds: null, warnedStale: new Set(),
