<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>The Larkin — Front desk</title>
<!-- Inter loads without blocking first paint: a preload that becomes a stylesheet once it lands
     (inline handler allowed by script-src 'unsafe-inline'); with scripts off the plain link applies.
     The system stack in --font paints in the meantime, so a blocked fonts.googleapis.com costs nothing. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"></noscript>
<!-- Front desk shell. Sources live in ops/src/ and are composed by `npm run build:ops`:
     each @include line becomes the file wrapped in <style> / <script>. The include order is
     the contract's: styles, calendar, leads, calls (CSS), then app, calls, calendar, leads (JS).
     app.js boots on DOMContentLoaded after every module has registered — no inline boot call. -->
<!-- @include styles.css -->
<!-- @include calendar.css -->
<!-- @include leads.css -->
<!-- @include calls.css -->
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="app">
  <aside class="side">
    <div class="brand">
      <span class="brand-name">The Larkin</span>
      <span class="brand-view" id="brand-view" aria-hidden="true">· Today</span>
      <span class="brand-sub">Front desk</span>
      <span class="brand-date" id="brand-date"></span>
    </div>
    <nav class="nav" aria-label="Views">
      <ul>
        <li><a class="nav-item" href="#/today" data-view="today"><span class="nav-icon" data-icon="today"></span><span class="nav-label">Today</span><span class="nav-badge" data-badge="today"></span></a></li>
        <li><a class="nav-item" href="#/calls" data-view="calls"><span class="nav-icon" data-icon="calls"></span><span class="nav-label">Calls</span><span class="nav-badge" data-badge="calls"></span></a></li>
        <li><a class="nav-item" href="#/leads" data-view="leads"><span class="nav-icon" data-icon="leads"></span><span class="nav-label">Leads</span><span class="nav-badge" data-badge="leads"></span></a></li>
        <li><a class="nav-item" href="#/calendar" data-view="calendar"><span class="nav-icon" data-icon="calendar"></span><span class="nav-label">Calendar</span><span class="nav-badge" data-badge="calendar"></span></a></li>
        <li><a class="nav-item" href="#/status" data-view="status"><span class="nav-icon" data-icon="status"></span><span class="nav-label">Status</span><span class="nav-badge" data-badge="status"></span></a></li>
      </ul>
    </nav>
    <div class="side-foot">
      <a class="cluster-link" href="#/status" id="cluster"></a>
      <a class="staff-only" href="#/status"><span class="ico" data-icon="lock"></span><span>Staff only</span></a>
    </div>
  </aside>
  <main id="main" tabindex="-1">
    <div class="global-banners" id="global-banners"></div>
    <section class="view" data-view="today" hidden></section>
    <section class="view" data-view="calls" hidden></section>
    <section class="view" data-view="leads" hidden></section>
    <section class="view" data-view="calendar" hidden></section>
    <section class="view" data-view="status" hidden></section>
  </main>
</div>
<div class="toast-stack" id="toasts" role="region" aria-label="Notifications" aria-live="polite" aria-relevant="additions text"></div>
<div class="vh" id="live" aria-live="polite" aria-atomic="true"></div>
<div id="dialogs"></div>
<!-- @include app.js -->
<!-- @include calls.js -->
<!-- @include calendar.js -->
<!-- @include leads.js -->
</body>
</html>
