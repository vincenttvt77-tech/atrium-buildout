<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atrium — Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14161a; --paper:#fbfaf8; --panel:#fff; --line:#e6e3de;
    --muted:#6b6862; --accent:#2f5d50; --warn:#8a5a1a; --danger:#9b2c2c; --ok:#2f5d50;
  }
  @media (prefers-color-scheme:dark){
    :root{--ink:#eceae6;--paper:#101114;--panel:#181a1e;--line:#2a2d33;--muted:#9a968e;
          --accent:#7fb3a2;--warn:#d8a45c;--danger:#e08585;--ok:#7fb3a2}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
       font:15px/1.55 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:32px 24px 80px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
         flex-wrap:wrap;margin-bottom:8px}
  h1{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0}
  .sub{color:var(--muted);font-size:13.5px;margin:4px 0 28px}
  .live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);
       box-shadow:0 0 0 0 rgba(47,93,80,.5);animation:p 2s infinite}
  @keyframes p{70%{box-shadow:0 0 0 7px rgba(47,93,80,0)}100%{box-shadow:0 0 0 0 rgba(47,93,80,0)}}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:32px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px 16px}
  .tile .n{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .tile .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-top:3px}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);
     font-weight:600;margin:0 0 12px;padding-bottom:9px;border-bottom:1px solid var(--line)}
  .call{background:var(--panel);border:1px solid var(--line);border-radius:10px;
        margin-bottom:14px;overflow:hidden}
  .call-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;
          justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .call-id{font:500 12.5px JetBrains Mono,ui-monospace,monospace;color:var(--muted)}
  .ev{display:grid;grid-template-columns:74px 1fr;gap:14px;padding:11px 16px;
      border-bottom:1px solid var(--line);font-size:13.5px;align-items:start}
  .ev:last-child{border-bottom:0}
  .t{font:400 11.5px JetBrains Mono,ui-monospace,monospace;color:var(--muted);padding-top:2px}
  .k{display:inline-block;font-size:10.5px;font-weight:600;text-transform:uppercase;
     letter-spacing:.06em;padding:2.5px 7px;border-radius:4px;margin-bottom:5px;
     background:rgba(120,120,120,.13);color:var(--muted)}
  .k.ok{background:rgba(47,93,80,.14);color:var(--ok)}
  .k.warn{background:rgba(138,90,26,.16);color:var(--warn)}
  .k.danger{background:rgba(155,44,44,.15);color:var(--danger)}
  .body{white-space:pre-wrap;word-break:break-word}
  .ex{border-left:2px solid var(--line);padding:2px 0 2px 11px;margin-top:6px;
      color:var(--muted);font-style:italic}
  .meta{font:400 11.5px JetBrains Mono,ui-monospace,monospace;color:var(--muted);margin-top:5px}
  .empty{background:var(--panel);border:1px dashed var(--line);border-radius:10px;
         padding:44px 24px;text-align:center;color:var(--muted)}
  .empty strong{display:block;color:var(--ink);font-weight:600;margin-bottom:6px;font-size:15px}
  .tel{font:600 15px Inter,sans-serif;color:var(--accent);text-decoration:none}
  .note{font-size:12.5px;color:var(--muted);margin-top:36px;padding-top:16px;
        border-top:1px solid var(--line)}
  @media(max-width:600px){.ev{grid-template-columns:1fr;gap:4px}.t{padding-top:0}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Operations</h1>
      <div class="sub">Every call, what was extracted, and what the agent did about it.</div>
    </div>
    <div class="live"><span class="dot"></span><span id="status">Live · refreshing every 5s</span></div>
  </header>

  <div class="tiles" id="tiles"></div>
  <h2>Call activity</h2>
  <div id="calls"></div>

  <div class="note" id="note"></div>
</div>

<script>
const KIND_STYLE = {
  emergency:'danger', escalated:'danger', question_refused:'warn',
  tour_booked:'ok', availability_checked:'', signal_captured:'ok',
  question_answered:'', loss_reason:'warn', quote_gate:'warn', error:'danger',
}
const LABEL = {
  signal_captured:'captured', quote_gate:'quote gate', availability_checked:'availability',
  question_answered:'answered', question_refused:'refused', tour_booked:'tour',
  escalated:'escalated', emergency:'emergency', loss_reason:'loss reason',
  slots_listed:'slots', call_status:'call', error:'error',
}
const money = n => '$' + Number(n).toLocaleString('en-US')

function describe(e){
  switch(e.kind){
    case 'signal_captured':
      return {body:`${e.signal} = ${e.value}`, excerpt:e.excerpt,
              meta:`confidence ${Math.round((e.confidence??0)*100)}%`}
    case 'quote_gate':
      return {body: e.allowed ? 'Cleared to quote'
        : `Blocked — has ${(e.captured||[]).join(', ')||'nothing'}, still needs ${(e.missing||[]).join(', ')}`}
    case 'availability_checked':
      if(e.outcome==='priced_out') return {
        body:`Priced out — ceiling ${money(e.budgetMax)}, cheapest available ${money(e.cheapestAvailable)}`,
        meta:`gap ${money(e.gap)} · this is the countable loss reason`}
      if(e.outcome==='matches') return {body:`Offered ${(e.unitsOffered||[]).join(', ')}`}
      return {body:`No match — ${e.outcome}`}
    case 'question_answered':
      return {body:`"${e.question}" → ${e.decision}`,
              meta:(e.sources&&e.sources.length)?`sources ${e.sources.join(', ')}`:`topic ${e.topic}`}
    case 'question_refused':
      return {body:`"${e.question}" → refused, did not guess`,
              meta:`${e.reason} · asked ${e.timesAsked||1}×`}
    case 'tour_booked':
      return {body:`${e.status.toUpperCase()} — ${e.slot}${e.unitId?` · unit ${e.unitId}`:''}`,
              meta:[e.prospectName,e.prospectEmail].filter(Boolean).join(' · ')}
    case 'escalated': return {body:`${e.trigger}`, meta:e.detail||''}
    case 'emergency': return {body:`${e.emergencyKind} detected`, excerpt:e.matched}
    case 'loss_reason':
      return {body:`${e.reason?.kind} — ${e.reason?.detail}`, excerpt:e.reason?.evidence}
    case 'slots_listed': return {body:`${e.count} tour times offered`}
    case 'call_status': return {body:e.status}
    case 'error': return {body:e.message}
    default: return {body:JSON.stringify(e)}
  }
}

function render(data){
  const evs = data.events || []
  const byCall = {}
  for(const e of evs){ (byCall[e.callId] ||= []).push(e) }

  const calls = Object.keys(byCall)
  const booked = evs.filter(e=>e.kind==='tour_booked'&&e.status==='confirmed').length
  const esc = evs.filter(e=>e.kind==='escalated').length
  const refused = evs.filter(e=>e.kind==='question_refused').length
  const pricedOut = evs.filter(e=>e.kind==='availability_checked'&&e.outcome==='priced_out')
  const avgGap = pricedOut.length
    ? Math.round(pricedOut.reduce((s,e)=>s+(e.gap||0),0)/pricedOut.length) : null

  document.getElementById('tiles').innerHTML = [
    [calls.length,'Calls'], [booked,'Tours booked'], [esc,'Escalations'],
    [refused,'Refused to guess'], [pricedOut.length,'Priced out'],
    [avgGap!==null?money(avgGap):'—','Avg gap'],
  ].map(([n,l])=>`<div class="tile"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('')

  const el = document.getElementById('calls')
  if(calls.length===0){
    el.innerHTML = `<div class="empty"><strong>No calls yet</strong>
      Call <a class="tel" href="tel:+15169909252">(516) 990-9252</a> and this fills in as it happens.</div>`
    return
  }

  el.innerHTML = calls.reverse().map(id=>{
    const rows = byCall[id].map(e=>{
      const d = describe(e)
      const t = new Date(e.at).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'})
      return `<div class="ev"><div class="t">${t}</div><div>
        <span class="k ${KIND_STYLE[e.kind]||''}">${LABEL[e.kind]||e.kind}</span>
        <div class="body">${escapeHtml(d.body||'')}</div>
        ${d.excerpt?`<div class="ex">"${escapeHtml(d.excerpt)}"</div>`:''}
        ${d.meta?`<div class="meta">${escapeHtml(d.meta)}</div>`:''}
      </div></div>`
    }).join('')
    return `<div class="call"><div class="call-h">
      <span class="call-id">${escapeHtml(id)}</span>
      <span class="call-id">${byCall[id].length} events</span>
    </div>${rows}</div>`
  }).join('')
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
}

async function tick(){
  try{
    const r = await fetch('/api/vapi',{cache:'no-store'})
    const d = await r.json()
    render(d)
    document.getElementById('status').textContent =
      'Live · updated ' + new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})
    document.getElementById('note').textContent = d.note || ''
  }catch(err){
    document.getElementById('status').textContent = 'Reconnecting…'
  }
}
tick(); setInterval(tick, 5000)
</script>
</body>
</html>
